name: CI
on:
  pull_request:
  push:
    branches:
      - master
      - 'security/**'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sovereign_ci
          POSTGRES_USER: sovereign_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sovereign_test -d sovereign_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix backend
      - name: Syntax check
        run: npm run check:syntax --prefix backend
      - name: Unit tests
        run: npm test --prefix backend
      - name: Isolated PostgreSQL API integration and authorization tests
        env:
          RUN_DB_INTEGRATION: '1'
          NODE_ENV: test
          DATABASE_URL: postgresql://sovereign_test:isolated-ci-only@localhost:5432/sovereign_ci
          JWT_SECRET: integration-test-secret-not-a-real-production-secret-very-long
        run: npm test --prefix backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix frontend
      - name: Build
        run: npm run build --prefix frontend
